name: Publish Dev Env

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "dev_env/**"
      - ".dev-env.json"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BLOG_TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check dev env output exists
        run: test -f dev_env/index.md

      - name: Skip when dispatch token is missing
        if: ${{ env.BLOG_TOKEN == '' }}
        run: echo "BLOG_DISPATCH_TOKEN is not configured; skipping blog dispatch."

      - name: Send repository dispatch to blog
        if: ${{ env.BLOG_TOKEN != '' }}
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          TARGET_BLOG_REPO: yuykim/yuykim-dev-diary
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $BLOG_TOKEN" \
            https://api.github.com/repos/$TARGET_BLOG_REPO/dispatches \
            -d "{
              \"event_type\": \"dev_env_updated\",
              \"client_payload\": {
                \"source_repo\": \"$SOURCE_REPO\",
                \"source_sha\": \"$SOURCE_SHA\"
              }
            }"
